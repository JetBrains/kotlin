name: Junie Live

on:
  workflow_dispatch: { }
  schedule:
    - cron: "0 */5 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: junie-live
  cancel-in-progress: false

jobs:
  run-junie-live:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      # All configurable values come from GitHub Actions secrets (not vars).
      JUNIE_LIVE_VERSION: ${{ secrets.JUNIE_LIVE_VERSION || 'latest' }}
      JUNIE_LIVE_PROJECT_ID: ${{ secrets.JUNIE_LIVE_PROJECT_ID }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      # Workspace = normal Actions checkout of this repo (kotlin root).
      JUNIE_LIVE_WORKSPACE: ${{ github.workspace }}
      # NOTE: do not use ${{ runner.temp }} here — the runner context is not
      # available in job-level env. RUNNER_TEMP is exported by the runner itself;
      # JUNIE_LIVE_RUN_DIR is finalized in the prepare step via GITHUB_ENV.
      COMPOSE_FILE: .junie-live/docker-compose.ci.yaml

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Resolves which installation of the Junie Live GitHub App covers this
      # repository. Only the installation id is consumed: the tokens Git and
      # the PR tools use are minted from the App key for the length of the run,
      # so this step's own token (valid for an hour and revoked when the job
      # ends) is deliberately left unused.
      - name: Resolve Junie Live GitHub App installation
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.JUNIE_LIVE_GITHUB_APP_ID }}
          private-key: ${{ secrets.JUNIE_LIVE_GITHUB_APP_PRIVATE_KEY }}

      # Proxy gets real secrets; agent gets only non-secret ids / public context.
      # Runtime (junie-live, hermes, junie) lives inside the image built from
      # .junie-live/Dockerfile — nothing is installed on the runner host, and the
      # Anthropic sandbox runtime is not used (--use-sandbox=false).
      - name: Prepare proxy and agent env files
        env:
          JUNIE_API_KEY: ${{ secrets.JUNIE_API_KEY }}
          GITHUB_APP_ID: ${{ secrets.JUNIE_LIVE_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.JUNIE_LIVE_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          SLACK_BOT_TOKEN_JUNIE_LIVE: ${{ secrets.SLACK_BOT_TOKEN_JUNIE_LIVE }}
          SLACK_APP_TOKEN_JUNIE_LIVE: ${{ secrets.SLACK_APP_TOKEN_JUNIE_LIVE }}
          JUNIE_LIVE_BACKEND_TOKEN: ${{ secrets.JUNIE_LIVE_BACKEND_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          # runner.temp is unavailable in job-level env; use the runner-provided
          # RUNNER_TEMP env var and export for later steps (compose volumes, logs).
          JUNIE_LIVE_RUN_DIR="${RUNNER_TEMP}/junie-live-cli"
          echo "JUNIE_LIVE_RUN_DIR=${JUNIE_LIVE_RUN_DIR}" >> "$GITHUB_ENV"

          mkdir -p "$JUNIE_LIVE_RUN_DIR/out"

          required=(
            JUNIE_API_KEY
            GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GITHUB_APP_INSTALLATION_ID
            SLACK_BOT_TOKEN_JUNIE_LIVE SLACK_APP_TOKEN_JUNIE_LIVE
            JUNIE_LIVE_BACKEND_TOKEN JUNIE_LIVE_PROJECT_ID SLACK_CHANNEL_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Junie Live value: $name"
              exit 1
            fi
          done

          # Path seen inside the containers (compose bind-mounts the checkout there).
          workspace_in_container="/workspace/kotlin"

          {
            printf '%s=%s\n' JUNIE_API_KEY "$JUNIE_API_KEY"
            printf '%s=%s\n' GITHUB_APP_ID "$GITHUB_APP_ID"
            printf '%s=%s\n' GITHUB_APP_INSTALLATION_ID "$GITHUB_APP_INSTALLATION_ID"
            # The App private key is multi-line PEM material, so it is written
            # as a double-quoted value: the env-file format keeps such a value
            # verbatim, newlines included.
            printf '%s="%s"\n' GITHUB_APP_PRIVATE_KEY "$GITHUB_APP_PRIVATE_KEY"
            printf '%s=%s\n' SLACK_BOT_TOKEN_JUNIE_LIVE "$SLACK_BOT_TOKEN_JUNIE_LIVE"
            printf '%s=%s\n' SLACK_APP_TOKEN_JUNIE_LIVE "$SLACK_APP_TOKEN_JUNIE_LIVE"
            printf '%s=%s\n' JUNIE_LIVE_BACKEND_TOKEN "$JUNIE_LIVE_BACKEND_TOKEN"
            printf '%s=%s\n' JUNIE_LIVE_PROJECT_ID "$JUNIE_LIVE_PROJECT_ID"
            printf '%s=%s\n' SLACK_CHANNEL_ID "$SLACK_CHANNEL_ID"
            printf '%s=%s\n' GITHUB_WORKSPACE "$workspace_in_container"
            printf '%s=%s\n' GITHUB_SERVER_URL "$GITHUB_SERVER_URL"
            printf '%s=%s\n' GITHUB_API_URL "$GITHUB_API_URL"
            printf '%s=%s\n' GITHUB_REPOSITORY "$GITHUB_REPOSITORY"
          } > "$JUNIE_LIVE_RUN_DIR/secrets.env"

          {
            printf '%s=%s\n' JUNIE_LIVE_PROJECT_ID "$JUNIE_LIVE_PROJECT_ID"
            printf '%s=%s\n' SLACK_CHANNEL_ID "$SLACK_CHANNEL_ID"
            printf '%s=%s\n' GITHUB_WORKSPACE "$workspace_in_container"
            printf '%s=%s\n' GITHUB_SERVER_URL "$GITHUB_SERVER_URL"
            printf '%s=%s\n' GITHUB_API_URL "$GITHUB_API_URL"
            printf '%s=%s\n' GITHUB_REPOSITORY "$GITHUB_REPOSITORY"
            printf '%s=%s\n' GITHUB_RUN_ID "$GITHUB_RUN_ID"
            printf '%s=%s\n' CI true
            printf '%s=%s\n' GITHUB_ACTIONS true
          } > "$JUNIE_LIVE_RUN_DIR/agent.env"

          {
            printf 'JL_RUN_ID=github-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

          # Agent must never see secrets.env — only the dedicated out/ + agent.env mounts.
          chmod 600 "$JUNIE_LIVE_RUN_DIR/secrets.env" "$JUNIE_LIVE_RUN_DIR/agent.env"
          ls -la "$JUNIE_LIVE_RUN_DIR"

      - name: Build Junie Live image
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f "$COMPOSE_FILE" build

      - name: Start Junie Live (proxy + agent)
        shell: bash
        run: |
          set -euo pipefail
          # Blocks until the agent container exits; proxy shares its netns so
          # 127.0.0.1 credential listeners are reachable without SRT.
          docker compose -f "$COMPOSE_FILE" up \
            --abort-on-container-exit \
            --exit-code-from agent

      - name: Collect Junie Live logs
        if: ${{ always() }}
        env:
          JUNIE_LIVE_LOG_STAGE: ${{ runner.temp }}/junie-live-logs
        shell: bash
        run: |
          set +e

          mkdir -p "$JUNIE_LIVE_LOG_STAGE"

          docker compose -f "$COMPOSE_FILE" logs --no-color proxy \
            > "$JUNIE_LIVE_LOG_STAGE/proxy.log" 2>&1
          docker compose -f "$COMPOSE_FILE" logs --no-color agent \
            > "$JUNIE_LIVE_LOG_STAGE/agent.log" 2>&1

          # start-agent --log-file (bind-mounted; no secrets in this dir).
          cp -f "$JUNIE_LIVE_RUN_DIR/out/agent.log" "$JUNIE_LIVE_LOG_STAGE/agent-cli.log" 2>/dev/null

          # Per-run diagnostics written inside the agent container. Allow-list
          # only: the run tree may hold runtime state we do not want in artifacts.
          agent_cid="$(docker compose -f "$COMPOSE_FILE" ps -aq agent | head -n1)"
          if [[ -n "$agent_cid" ]]; then
            raw="$RUNNER_TEMP/junie-live-runs-raw"
            rm -rf "$raw"
            docker cp "$agent_cid:/root/.junie-live/runs" "$raw" 2>/dev/null
            if [[ -d "$raw" ]]; then
              for run_dir in "$raw"/*/; do
                [[ -d "$run_dir" ]] || continue
                dest="$JUNIE_LIVE_LOG_STAGE/runs/$(basename "$run_dir")"
                mkdir -p "$dest"
                cp -f "$run_dir"logs/*.log "$dest/" 2>/dev/null
                for name in manifest.json gateway.json effective-config.yaml; do
                  cp -f "$run_dir$name" "$dest/" 2>/dev/null
                done
              done
            fi
            rm -rf "$raw"
          fi

          chmod -R u+rw "$JUNIE_LIVE_LOG_STAGE" 2>/dev/null

      - name: Stop Junie Live
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans
          # secrets.env lives here — always wipe the run dir.
          rm -rf "$JUNIE_LIVE_RUN_DIR"

      - name: Upload Junie Live logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junie-live-logs
          path: ${{ runner.temp }}/junie-live-logs
          retention-days: 7
          if-no-files-found: warn
