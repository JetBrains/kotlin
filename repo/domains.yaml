$schema: domains.schema.json

Compiler:
  include:
    - "build-common"
    - "compiler/*.kts"
    - "compiler/*.md"
    - "compiler/arguments"
    - "compiler/arguments.common"
    - "compiler/cli"
    - "compiler/compiler.version"
    - "compiler/config"
    - "compiler/config.jvm"
    - "compiler/container"
    - "compiler/preloader"
    - "compiler/test-infrastructure*"
    - "compiler/test-security-manager"
    - "compiler/testData" # Potentially could marked more granularly later"
    - "compiler/testFixtures"
    - "compiler/testResources"
    - "compiler/tests"
    - "compiler/tests-common*"
    - "compiler/tests-compiler-utils"
    - "compiler/tests-gen"
    - "compiler/tests-integration"
    - "compiler/tests-mutes" # Not sure where it should belong"
    - "compiler/util"
    - "compiler/util-io"
    - "core"
    - "jps" # probably should be moved to build tools or BTA"

  exclude:
    - "compiler/cli/cli-jklib"
  fullyAffectedBy:
    - CoreLibs

Frontend:
  include:
    - "compiler/fir"
    - "compiler/frontend*"
    - "compiler/ir/ir.psi2ir"
    - "compiler/java-direct"
    - "compiler/javac-wrapper"
    - "compiler/multiplatform-parsing"
    - "compiler/psi/parser"
    - "compiler/resolution*"
    - "compiler/serialization*"
    - "compiler/tests-java8"
    - "compiler/tests-spec"
    - "thiswontmatch"
  exclude:
    - thisWontEither

CommonBackend:
  include:
    - "compiler/cli/cli-jklib"
    - "compiler/ir/backend.common"
    - "compiler/ir/ir.actualization"
    - "compiler/ir/ir.inline"
    - "compiler/ir/ir.tree"
    - "compiler/ir/ir.validation"
    - "compiler/ir/serialization.common"
    - "compiler/ir/serialization.jklib"
    - "compiler/jklib.tests"
    - "compiler/util-klib"
    - "compiler/util-klib-abi"
    - "compiler/util-klib-metadata"

Jvm:
  include:
    - "compiler/android-tests"
    - "compiler/backend"
    - "compiler/backend.common.jvm"
    - "compiler/ir/backend.jvm"
    - "compiler/ir/serialization.jvm"
    - "compiler/tests-different-jdk"

Wasm:
  include:
    - "wasm"
    - "compiler/ir/backend.wasm"
    - "js/js.translator/testData"
  fullyAffectedBy:
    - Compiler
    - CoreLibs
Js:
  include:
    - "js"
    - "libraries/tools/analysis-api-based-klib-reader"
    - "compiler/ir/backend.js"
    - "compiler/ir/serialization.js"
  fullyAffectedBy:
    - Compiler
    - CoreLibs

Native:
  include:
    - "native"
    - "kotlin-native"
    - "compiler/ir/backend.native"
    - "compiler/ir/ir.objcinterop"
    - "compiler/ir/serialization.native"
  exclude:
    - "native/swift"
  fullyAffectedBy:
    - Compiler
    - CoreLibs

CoreLibs:
  include:
    - "libraries/stdlib"
    - "libraries/tools/kotlin-annotations-jvm"
    - "core/metadata*"
    - "core/reflect*"
    # Old reflect
    - "core/descriptors.runtime"
    - "libraries/kotlinx-metadata"
    - "libraries/reflect"
    - "libraries/kotlin.test"
    - "libraries/tools/jdk-api-validator"

AnalysisApi:
  include:
    - "analysis"
    - "compiler/psi"
    - "prepare/analysis-api"
  exclude:
    - "compiler/psi/parser"
  fullyAffectedBy:
    - Compiler
    - CoreLibs

BuildToolsApi:
  include:
    - "build-common"
    - "compiler/build-tools"
    - "compiler/incremental-compilation-*"
    - "compiler/daemon"
    - "compiler/compiler-runner-unshaded"
  fullyAffectedBy:
    - Compiler

SwiftExport:
  include:
    - "native/swift"
    - "libraries/tools/analysis-api-based-klib-reader"
  fullyAffectedBy:
    - AnalysisApi # todo: Replace this dependency with a reviewed set of @AffectedByAnalysisApi tests

CompilerPlugins:
  include:
    - "plugins"
    - "compiler/plugin-api"
  fullyAffectedBy:
    - Compiler

Gradle:
  include:
    - "build-common"
    - "libraries/tools/*gradle*"
    - "compiler/build-tools/kotlin-build-statistics"

Maven:
  include:
    - "libraries/tools/*maven*"

# The IntelliJ domain has no owned files in this repository.
# It is used to declare which domains will affect IntelliJ and to infer when to run tests against kt-master
IntelliJ:
  include:
    - "prepare/ide-plugin-dependencies"
  fullyAffectedBy:
    - Compiler
    - AnalysisApi
    - CoreLibs

BuildInfrastructure:
  include:
    - "repo"
    - "gradle"
    - "build.gradle.kts"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "scripts"
    - ".space"
    - ".idea"

Unknown:
  # Files not matching other domains will be sorted into 'Unknown' by default.
  include: [ ]
  fullyAffectedBy:
    - Compiler
