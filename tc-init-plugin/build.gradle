plugins {
    id 'groovy'
    id 'java-gradle-plugin'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()
}

gradlePlugin {
    plugins {
        teamCityInit {
            id = 'org.jetbrains.teamcity.init'
            implementationClass = 'org.jetbrains.teamcity.TeamCityInitPlugin'
        }
    }
}
