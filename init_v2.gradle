    final String jvmargs = System.getenv(Constants.GRADLE_TEST_COVERAGE_JVM_ARGS_ENV_VAR)
    final String[] arguments = jvmargs == null || jvmargs.isEmpty() ? new String[0] : jvmargs.split("\n")
    TestTaskWrapper.forAllTestTasks(project.tasks.withType(AbstractTestTask.class)) { TestTaskWrapper testTask ->
        def buildTempDirectory = System.getenv(Constants.BUILD_TEMP_DIR_ENV_VAR)
        testTask.setTmpDirectory(buildTempDirectory).jvmArgs(arguments)

        def testNameFormat = System.getenv(Constants.TEST_NAME_FORMAT_ENV_VAR)
        def testNameDescriptor = TestNameDescriptor.of(testNameFormat)
        def ignoredSuiteFormat = System.getenv(Constants.IGNORED_SUITE_FORMAT_ENV_VAR)

        def testListener = new TeamcityTestListener(logger, testTask, project, testCounter, testNameDescriptor, ignoredSuiteFormat)
        testTask.addTestListener(testListener)
        testTask.addTestOutputListener(testListener)
        testListener.skipStdOut = Boolean.valueOf(System.getProperty(Constants.IGNORE_TEST_STDOUT_SYSTEM_PROP))
        testListener.skipStdErr = Boolean.valueOf(System.getProperty(Constants.IGNORE_TEST_STDERR_SYSTEM_PROP))

        // add executable tests
        testTask.filter.updateFilters(System.getenv(Constants.PARALLEL_TESTS_ARTIFACT_PATH_ENV_VAR), logger)
        // will be empty if parallel tests enabled
        testTask.filter.updateFilters(System.getenv(Constants.RISK_TESTS_ARTIFACT_PATH_ENV_VAR), logger)
    }
}
