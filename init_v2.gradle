/**
 * Use WrappedException if you need to make a error message shorter
 */
@CompileStatic
class WrappedException extends Exception {
    private static final int MAX_MESSAGE_SIZE = Integer.getInteger(Constants.STACKTRACE_MAX_LENGTH_SYSTEM_PROP, 18 * 1024)
    private static final int MIN_ATTACHED_MESSAGE_SIZE = Integer.getInteger(Constants.MIN_ATTACHED_TEST_EXCEPTION_SYSTEM_PROP, MAX_MESSAGE_SIZE)

    final Throwable th
    private final int maxLength
    private final String DELIMITER
    private final String message
    private final String thMessage

    /**
     * @param th original exception
     */
    WrappedException(Throwable th) {
        this(th, MAX_MESSAGE_SIZE)
    }

    /**
     * @param th     original exception
     * @param length max message length
     */
    WrappedException(Throwable th, int maxLength) {
        this.th = th != null ? th : new Exception() {
            @Override void printStackTrace(PrintWriter printWriter) { }
            @Override void printStackTrace(PrintStream ps) { }
            @Override void printStackTrace() { }
            @Override Throwable fillInStackTrace() { this }
            @Override StackTraceElement[] getStackTrace() { new StackTraceElement[0] }
            @Override String toString() { "" }
        }

        this.maxLength = maxLength
        int size = (int) (maxLength / 1024)
        DELIMITER = "***** A part of the stacktrace was cut by TeamCity build agent because the stacktrace size exceeded ${size} KB *****"
        thMessage = this.th.toString()
        message = trim(thMessage, maxLength)
    }

    private int getSize() {
        return thMessage.length()
    }

    @Override
    public String toString() {
        return message
    }

    public boolean isSmall() {
        if (MIN_ATTACHED_MESSAGE_SIZE == -1) return true
        if (MIN_ATTACHED_MESSAGE_SIZE > getSize()) return true
        if (getSize() <= maxLength) return true
        return false
    }

    public ServiceMessage getServiceMessage(String testName) {
        if (thMessage.length() == 0) return new ServiceMessage(name: "testFailed", attributes: [name: testName, message: message, details: getStacktrace()])
        Map.Entry<String, String> cfd = extractComparisonFailure(th)
        if (cfd != null) {
            return new ServiceMessage(name: "testFailed", attributes: [name    : testName,
                                                                       message : message,
                                                                       details : getStacktrace(),
                                                                       actual  : trim(cfd.key, maxLength),
                                                                       expected: trim(cfd.value, maxLength)])
        } else {
            return new ServiceMessage(name: "testFailed", attributes: [name: testName, message: message, details: getStacktrace()])
        }
    }

    private static String getFieldValue(Throwable th, String fieldName) {
        try {
            Field field = th.getClass().getDeclaredField(fieldName)
            field.setAccessible(true)
            Object val = field.get(th)
            return val != null ? val.toString() : null
        } catch (Throwable ignored) {
            return null
        }
    }

    private Map.Entry<String, String> extractComparisonFailure(Throwable th) {
        Map.Entry<String, String> comparisonFailure = extractComparisonFailureWithComparisonFailureUtil(th)
        if (comparisonFailure != null) return comparisonFailure

        comparisonFailure = extractOpenTest4jFailure(th)
        if (comparisonFailure != null) return comparisonFailure

        String actual = getFieldValue(th, 'fActual')
        String expected = getFieldValue(th, 'fExpected')
        if (actual != null && expected != null) return new AbstractMap.SimpleEntry<String, String>(actual, expected)

        String message = th.getLocalizedMessage()
        if (message == null) return null

        Map.Entry<String, String> res = parseComparison(message, "expected:<", "> but was:<", ">") // JUnit 4 (no spaces after ':' or 'was:')
        if (res != null) return res
        res = parseComparison(message, "expected: <", "> but was: <", ">") // JUnit 5 / OpenTest4j (spaces after ':' and 'was:')
        if (res != null) return res
        return parseComparison(message, "expected [", "] but found [", "]") // TestNG
    }

    private Map.Entry<String, String> extractOpenTest4jFailure(Throwable th) {
        try {
            Method getExpected = th.getClass().getMethod("getExpected")
            Method getActual = th.getClass().getMethod("getActual")
            Object expectedObj = getExpected.invoke(th)
            Object actualObj = getActual.invoke(th)
            if (expectedObj != null && actualObj != null) {
                Method getValueExpected = expectedObj.getClass().getMethod("getValue")
                Method getValueActual = actualObj.getClass().getMethod("getValue")
                Object expectedVal = getValueExpected.invoke(expectedObj)
                Object actualVal = getValueActual.invoke(actualObj)
                if (expectedVal != null && actualVal != null) {
                    return new AbstractMap.SimpleEntry<String, String>(actualVal.toString(), expectedVal.toString())
                }
            }
        } catch (Throwable ignored) { }
        return null
    }

    private Map.Entry<String, String> extractComparisonFailureWithComparisonFailureUtil(Throwable th) {
        try {
            Class<?> utilClass = Class.forName('jetbrains.buildServer.ComparisonFailureUtil')
            Method method = utilClass.getMethod("extractComparisonFailure", Throwable)
            Object cfd = method.invoke(null, th)
            if (cfd != null) {
                Method getActual = cfd.getClass().getMethod("getActual")
                Method getExpected = cfd.getClass().getMethod("getExpected")
                Object actual = getActual.invoke(cfd)
                Object expected = getExpected.invoke(cfd)
                if (actual != null && expected != null) {
                    return new AbstractMap.SimpleEntry<String, String>(actual.toString(), expected.toString())
                }
            }
        } catch (Throwable ignored) { }
        return null
    }

    private Map.Entry<String, String> parseComparison(String msg, String start, String separator, String end) {
        int expectedIdx = msg.indexOf(start)
        if (expectedIdx >= 0) {
            int butWasIdx = msg.indexOf(separator, expectedIdx + start.length())
            if (butWasIdx >= 0) {
                int endIdx = msg.lastIndexOf(end)
                if (endIdx >= 0 && endIdx > butWasIdx) {
                    String expected = msg.substring(expectedIdx + start.length(), butWasIdx)
                    String actual = msg.substring(butWasIdx + separator.length(), endIdx)
                    return new AbstractMap.SimpleEntry<String, String>(actual, expected)
                }
            }
        }
        return null
    }

    private String getStacktrace() {
        ByteArrayOutputStream out = new ByteArrayOutputStream()
        th.printStackTrace(new PrintStream(out))
        return out.toString()
    }

    /**
     * Print StackTrace from the delegate object but a message from current current
     */
    @Override
    void printStackTrace(final PrintStream s) {
        Throwable exc = this;
        PrintStream stream = new PrintStream(s) {
            @Override
            void println(final Object obj) {
                super.println(th.is(obj) ? exc : obj)
            }
        }
        th.printStackTrace(stream)
    }

    /**
     * Split the message into 2 parts, if its size is large
     * @param str original message
     * @param length       max length
     * @return original message if str.length < length or split message with delimiter
     */
    private String trim(String str, int maxLength) {
        if (str == null || str.length() <= maxLength) return str

        return """${str.substring(0, (int)(maxLength / 2))} ...

${DELIMITER}

... ${str.substring(str.length() - (int)(maxLength / 2))}"""
    }
}

@CompileStatic
class TestTaskWrapper {
    private final AbstractTestTask testTask

    /**
     * Use {@link TestTaskWrapper#forAllTestTasks} to instantiate this object correctly.
     */
    private TestTaskWrapper(AbstractTestTask testTask) { this.testTask = testTask }

    void addTestListener(TestListener listener) { testTask.addTestListener(listener) }

    void addTestOutputListener(TestOutputListener listener) { testTask.addTestOutputListener(listener) }

    String getTaskPath() { testTask.getPath() }

    TestTaskWrapper jvmArgs(String[] arguments) {
        if (testTask instanceof Test && arguments != null && arguments.length > 0) {
            ((Test) testTask).jvmArgumentProviders.add(new TestTaskJvmArgumentsProvider(arguments))
        }
        return this
    }

    TestTaskWrapper setTmpDirectory(String path) {
        if (testTask instanceof Test && path != null && path.length() > 0) {
            ((Test) testTask).systemProperty("java.io.tmpdir", path)
        }
        return this
    }

    TestFilterWrapper getFilter() {
        if (testTask instanceof Test) {
            return new TestFilterWrapper(((Test) testTask).getFilter())
        }
        return new TestFilterWrapper(null)
    }

    /**
     * Creates an instance of the {@link TestTaskWrapper} for every instance of the Test in the TaskCollection.
     * The Closure action is applied lazily via configureEach
     */
    static void forAllTestTasks(TaskCollection<AbstractTestTask> taskCollection, Closure action) {
        // Use lazy task configuration:
        // https://docs.gradle.org/current/userguide/task_configuration_avoidance.html
        taskCollection.configureEach { AbstractTestTask task ->
            TestTaskWrapper wrapper = new TestTaskWrapper(task)
            action.call(wrapper)
        }
    }
}

@CompileStatic
class TestTaskJvmArgumentsProvider implements org.gradle.process.CommandLineArgumentProvider {
    private final List<String> arguments

    TestTaskJvmArgumentsProvider(String[] arguments) {
        this.arguments = Arrays.asList(arguments)
    }

    @Override
    Iterable<String> asArguments() {
        return arguments
    }
}

@CompileStatic
class TestFilterWrapper {
    final TestFilter filter

    TestFilterWrapper(TestFilter filter) {
        this.filter = filter
    }

    void setFailOnNoMatchingTests(boolean failOnNoMatchingTests) {
        if (filter != null) {
            filter.setFailOnNoMatchingTests(failOnNoMatchingTests)
        }
    }

    void excludeTest(String className, String methodName) {
        if (filter != null && className != null && className.trim().length() > 0) {
            filter.excludeTest(className, methodName)
        }
    }

    boolean isSupported() {
        return filter != null
    }

    void updateFilters(String fileName, Logger logger) {
        if (fileName == null || fileName.trim().length() == 0) {
            return
        }
        File file = new File(fileName)
        if (!file.exists()) {
            return
        }
        if (!isSupported()) {
            return
        }

        setFailOnNoMatchingTests(false)
        file.eachLine { String line ->
            if (!line.startsWith("#")) excludeTest(line, null)
        }
    }
}

