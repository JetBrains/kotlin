// region Extension of the project's extra properties with TeamCity build properties

// This class extends the Gradle project properties (project.ext) with TeamCity build properties.
// This is quite complicated for setups that use the configuration cache, as it can lead unnecessary configuration cache invalidations.
// Possibly, a better approach would be to avoid extending project.ext altogether.
// The property extension can be kept for older Gradle versions and removed for newer versions.
@CompileStatic
class ProjectExtraPropertiesExtender {

    static void extend(Project project, Logger logger) {
        addTeamCityPropertiesToExtraProperties(project, logger)
    }

    static void logBuildPropertiesUsageWarningMessageIfNeeded(Gradle gradle, Logger logger) {
        if (doNotPopulateGradleProperties() || !BuildFeatures.isConfigurationCacheRequested(gradle)) return

        def warningMessage =
                "\nGradle Configuration Cache is used in this build.\n" +
                        "Avoid accessing TeamCity build properties from the Gradle project " +
                        "('project.teamcity.buildProperty', 'project.buildProperty', 'teamcity.buildProperty', '\$buildProperty', etc.), " +
                        "as they can cause issues in Configuration Cache setups and will be removed for newer Gradle versions.\n" +
                        "If you experience unwarranted Configuration Cache invalidations, " +
                        "disable the population of the project properties with TeamCity build properties by setting " +
                        "the 'teamcity.internal.gradle.runner.doNotPopulateGradleProperties' configuration parameter to 'true'.\n"
        logger.lifecycle(warningMessage)
    }

    private static void addTeamCityPropertiesToExtraProperties(Project project, Logger logger) {
        if (doNotPopulateGradleProperties()) return

        Properties properties = getPropertiesFromFile(logger)
        if (!BuildFeatures.isConfigurationCacheRequested(project.gradle)) {
            // When the configuration cache is not used,
            // we can simply read the file and directly add the properties from it to the project's extra properties,
            // as we did in the older init script.
            for (String key : properties.stringPropertyNames()) {
                project.getExtensions().getExtraProperties().set(key, properties.getProperty(key))
            }
            project.getExtensions().getExtraProperties().set("teamcity", properties)
        } else {
            // When the configuration cache is used, we add only the properties we consider non-volatile to 'project.ext'.
            // All properties, including volatile ones, can be accessed through the 'project.ext.teamcity' map.
            // This is done to ensure backwards compatibility with the previous integration logic (see init_since_8.gradle).
            // These properties are configured as configuration inputs, so a change to any of their values will invalidate the configuration cache.
            // In particular, a change to any of the non-volatile properties will invalidate the cache, even if the property is never accessed during the build.
            Map<Object, Object> nonVolatileProperties = (Map<Object, Object>) project.getProviders().of(TeamCityNonVolatilePropertiesValueSource.class) {}.getOrNull()
            if (nonVolatileProperties != null) {
                for (Map.Entry<Object, Object> entry : nonVolatileProperties.entrySet()) {
                    project.getExtensions().getExtraProperties().set(entry.getKey().toString(), entry.getValue())
                }
            }
            Map<String, String> tcExtraPropertiesMap = new TeamCityExtraPropertiesMap(project.getProviders(), properties)
            project.getExtensions().getExtraProperties().set("teamcity", tcExtraPropertiesMap)
        }
    }

    private static boolean doNotPopulateGradleProperties() {
        return Boolean.valueOf(System.getenv(Constants.DO_NOT_POPULATE_GRADLE_PROPERTIES_ENV_VAR)) ||
                Boolean.valueOf(System.getProperty("teamcity.internal.gradle.runner.doNotPopulateGradleProperties"))
    }

    private static Properties getPropertiesFromFile(Logger logger) {
        try {
            return PropertiesFileReader.loadPropertiesFromFile()
        } catch (IOException e) {
            logger.log(LogLevel.ERROR, e.getMessage(), e)
            return new Properties()
        }
    }
}

@CompileStatic
class PropertiesFileReader {
    // This method reads the file using RandomAccessFile, so that the file is not tracked as a configuration phase input.
    // Thus, changes to the file do not invalidate the configuration cache.
    // We need this because the properties file changes every build and we want to avoid unnecessary cache invalidations.
    // This method is used in the non-configuration cache setup as well for uniformity.
    static Properties loadPropertiesFromFile() throws IOException {
        String filePath = System.getenv(Constants.BUILD_PROPERTIES_FILE_ENV_VAR)
        if (filePath == null) return new Properties()

        def debugServiceMessage = new ServiceMessage(name: "message", attributes: [text: "Reading the Teamcity build properties file '$filePath'", "tc:tags": "tc:internal"])
        println(debugServiceMessage.asString())
        Properties properties = new Properties()
        RandomAccessFile randomAccessFile = new RandomAccessFile(filePath, "r")
        try {
            byte[] data = new byte[(int) randomAccessFile.length()]
            randomAccessFile.readFully(data)
            properties.load(new ByteArrayInputStream(data))
        } finally {
            randomAccessFile.close()
        }

        return properties
    }
}

// This class filters the properties we consider "non-volatile", meaning their values do not change from build to build.
// The heuristics used are quite unreliable. They are kept only for backwards compatibility with the previous integration logic (see init_since_8.gradle).
@CompileStatic
class NonVolatileBuildPropertiesFilter {
    static Map<Object, Object> filterNonVolatileProperties(Properties properties) {
        return (Map<Object, Object>) properties.findAll { Object key, Object value ->
            isANonVolatileProperty(key)
        }
    }

    private static boolean isANonVolatileProperty(Object key) {
        String propertyKey = key.toString()

        // If the parameter is a dependency parameter, we must drop the dependency source id prefix before evaluating if the parameter is volatile.
        // E.g. for 'dep.upstreamConfig.foo' we drop the ''dep.upstreamConfig' prefix before proceeding.
        if (propertyKey.startsWith("dep.")) {
            int propertyNameIndex = propertyKey.indexOf('.', "dep.".size()) + 1
            propertyKey = propertyKey.substring(propertyNameIndex)
        }

        if (propertyKey.startsWith("build.")) return false
        if (propertyKey.startsWith("teamcity.build.id")) return false
        if (nonVolatileTeamCityPrefixes.any { String prefix -> propertyKey.startsWith(prefix) }) return true

        return !propertyKey.startsWith("teamcity.")
    }

    private static final List<String> nonVolatileTeamCityPrefixes = [
            "teamcity.build.",
            "teamcity.buildConfName",
            "teamcity.buildType.",
            "teamcity.configuration.",
            "teamcity.runner.",
            "teamcity.projectName",
            "teamcity.tests."
    ]
}

// This class acts as an unmodifiable map accessible through project.ext.teamcity.
// Because TeamCityPropertyValueSource is used to retrieve property values,
// accessing a property by get(), getOrDefault(), or containsKey() will make the configuration cache invalidate
// for a later build if the property value changes.
@CompileStatic
class TeamCityExtraPropertiesMap extends AbstractMap<String, String> {
    private final ProviderFactory providerFactory
    private final Properties properties

    TeamCityExtraPropertiesMap(ProviderFactory providerFactory, Properties properties) {
        this.providerFactory = providerFactory
        this.properties = properties
    }

    @Override
    String get(Object key) {
        if (key == null) return null
        return this.providerFactory.of(TeamCityPropertyValueSource.class) { ValueSourceSpec<TeamCityPropertyValueSource.Parameters> spec ->
            spec.getParameters().getPropertyKey().set(key.toString())
        }.getOrNull()
    }

    @Override
    String getOrDefault(Object key, String defaultValue) {
        String value = get(key)
        if (value != null) {
            return value
        }
        return defaultValue
    }

    @Override
    boolean containsKey(Object key) {
        return get(key) != null
    }

    @Override
    Set<Entry<String, String>> entrySet() {
        Set<Entry<String, String>> entries = new LinkedHashSet<>()
        for (String key : properties.stringPropertyNames()) {
            entries.add(new AbstractMap.SimpleImmutableEntry<String, String>(key, get(key)))
        }
        return Collections.unmodifiableSet(entries)
    }
}

// ValueSource used to track accessed build properties as configuration phase inputs.
@CompileStatic
abstract class TeamCityPropertyValueSource implements ValueSource<String, Parameters>, Describable {
    interface Parameters extends ValueSourceParameters {
        Property<String> getPropertyKey()
    }

    @Override
    String obtain() {
        try {
            Properties properties = PropertiesFileReader.loadPropertiesFromFile()
            return properties.getProperty(parameters.propertyKey.get())
        } catch (IOException ignored) {
            return null
        }
    }

    @Override
    String getDisplayName() {
        return "TeamCity build property '${parameters.propertyKey.get()}'".toString()
    }
}

// ValueSource used to track all non-volatile build properties as a single configuration phase input.
// Used to populate 'project.ext' without re-reading the file for each property.
@CompileStatic
abstract class TeamCityNonVolatilePropertiesValueSource implements ValueSource<Map<Object, Object>, ValueSourceParameters.None>, Describable {
    @Override
    Map<Object, Object> obtain() {
        try {
            Properties properties = PropertiesFileReader.loadPropertiesFromFile()
            return NonVolatileBuildPropertiesFilter.filterNonVolatileProperties(properties)
        } catch (IOException ignored) {
            return null
        }
    }

    @Override
    String getDisplayName() {
        return "TeamCity build properties collection"
    }
}

