<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="12" y="22" font-size="15" font-weight="bold" fill="#111">Heap object, heap array and the two things the header word can point to (64-bit targets)</text>

  <!-- ===== heap object block ===== -->
  <text x="12" y="52" font-weight="bold" fill="#111">Heap object block</text>
  <text x="150" y="52" font-size="11.5" fill="#111">alloc::HeapObject&lt;GC::ObjectData&gt;: allocator header, then the Kotlin object; 8-byte aligned</text>
  <g font-size="10.5" fill="#111">
    <text x="12" y="76" text-anchor="start" fill="#444">offset</text>
    <rect x="60" y="62" width="130" height="36" fill="#fdf1dc" stroke="#444"/>
    <text x="65" y="76" fill="#444">-8</text>
    <text x="125" y="78" text-anchor="middle">GC::ObjectData</text>
    <text x="125" y="92" text-anchor="middle">next_ (mark bit / link)</text>
    <rect x="190" y="62" width="150" height="36" fill="#e8eef7" stroke="#444"/>
    <text x="195" y="76" fill="#444">0</text>
    <text x="265" y="78" text-anchor="middle">ObjHeader</text>
    <text x="265" y="92" text-anchor="middle">typeInfoOrMeta_ (tagged)</text>
    <rect x="340" y="62" width="300" height="36" fill="#eaf5e6" stroke="#444"/>
    <text x="345" y="76" fill="#444">8</text>
    <text x="490" y="78" text-anchor="middle">fields in ClassLayoutBuilder order</text>
    <text x="490" y="92" text-anchor="middle">(superclass prefix, then declared, sorted by size desc.)</text>
    <rect x="640" y="62" width="60" height="36" fill="#f0f0f0" stroke="#444"/>
    <text x="670" y="84" text-anchor="middle">pad to 8</text>
    <text x="712" y="78">instanceSize_ = LLVMStoreSizeOfType(body)</text>
    <text x="712" y="92">block = AllocationSize::bytesAtLeast(8 + instanceSize_)</text>
  </g>

  <!-- ===== heap array block ===== -->
  <text x="12" y="134" font-weight="bold" fill="#111">Heap array block</text>
  <text x="140" y="134" font-size="11.5" fill="#111">ArrayHeader = ObjHeader + count_; element size = -instanceSize_ of the array TypeInfo</text>
  <g font-size="10.5" fill="#111">
    <rect x="60" y="144" width="130" height="36" fill="#fdf1dc" stroke="#444"/>
    <text x="65" y="158" fill="#444">-8</text>
    <text x="125" y="160" text-anchor="middle">GC::ObjectData</text>
    <text x="125" y="174" text-anchor="middle">next_</text>
    <rect x="190" y="144" width="150" height="36" fill="#e8eef7" stroke="#444"/>
    <text x="195" y="158" fill="#444">0</text>
    <text x="265" y="160" text-anchor="middle">typeInfoOrMeta_</text>
    <rect x="340" y="144" width="80" height="36" fill="#e8eef7" stroke="#444"/>
    <text x="345" y="158" fill="#444">8</text>
    <text x="380" y="160" text-anchor="middle">count_</text>
    <text x="380" y="174" text-anchor="middle">uint32_t</text>
    <rect x="420" y="144" width="60" height="36" fill="#f0f0f0" stroke="#444"/>
    <text x="425" y="158" fill="#444">12</text>
    <text x="450" y="168" text-anchor="middle">pad</text>
    <rect x="480" y="144" width="220" height="36" fill="#eaf5e6" stroke="#444"/>
    <text x="485" y="158" fill="#444">16</text>
    <text x="590" y="160" text-anchor="middle">elements[count_]</text>
    <text x="590" y="174" text-anchor="middle">start at AlignUp(16, elemSize)</text>
    <text x="712" y="160">size = AlignUp(AlignUp(16, elemSize)</text>
    <text x="712" y="174">+ elemSize * count_, 8)   (KObject.hpp)</text>
  </g>

  <!-- ===== header word ===== -->
  <text x="12" y="222" font-weight="bold" fill="#111">The header word</text>
  <g font-size="10.5" fill="#111">
    <!-- bit box -->
    <rect x="60" y="232" width="330" height="30" fill="#e8eef7" stroke="#444"/>
    <text x="225" y="251" text-anchor="middle">pointer bits 63..2 (TypeInfo* or ExtraObjectData*)</text>
    <rect x="390" y="232" width="40" height="30" fill="#fdf1dc" stroke="#444"/>
    <text x="410" y="251" text-anchor="middle">tag</text>
    <text x="440" y="244">00 = OBJECT_TAG_HEAP   01 = OBJECT_TAG_PERMANENT (compiler data, no ObjectData)</text>
    <text x="440" y="258">11 = OBJECT_TAG_STACK (alloca, no ObjectData)   mask = 3; mirrored by permanentTag / immTypeInfoMask</text>
  </g>

  <!-- pointee 1: TypeInfo -->
  <g font-size="10.5" fill="#111">
    <text x="60" y="296" font-weight="bold">points to a TypeInfo (the common case)</text>
    <rect x="60" y="304" width="150" height="26" fill="#e8eef7" stroke="#444"/>
    <text x="65" y="321" fill="#444">0</text>
    <text x="140" y="321" text-anchor="middle">typeInfo_ = self</text>
    <rect x="210" y="304" width="200" height="26" fill="#f0f0f0" stroke="#444"/>
    <text x="310" y="321" text-anchor="middle">… rest of TypeInfo (see next figure)</text>
  </g>
  <!-- pointee 2: ExtraObjectData -->
  <g font-size="10.5" fill="#111">
    <text x="60" y="360" font-weight="bold">or to an ExtraObjectData (meta-object), installed by a CAS on the header word</text>
    <rect x="60" y="368" width="150" height="36" fill="#e8eef7" stroke="#444"/>
    <text x="65" y="382" fill="#444">0</text>
    <text x="135" y="384" text-anchor="middle">typeInfo_</text>
    <text x="135" y="398" text-anchor="middle">→ the real TypeInfo</text>
    <rect x="210" y="368" width="110" height="36" fill="#fdf1dc" stroke="#444"/>
    <text x="215" y="382" fill="#444">8</text>
    <text x="265" y="384" text-anchor="middle">flags_</text>
    <text x="265" y="398" text-anchor="middle">atomic u32 + pad</text>
    <rect x="320" y="368" width="170" height="36" fill="#fdf1dc" stroke="#444" stroke-dasharray="4,2"/>
    <text x="325" y="382" fill="#444">16</text>
    <text x="405" y="384" text-anchor="middle">associatedObject_</text>
    <text x="405" y="398" text-anchor="middle">ObjC interop builds only</text>
    <rect x="490" y="368" width="210" height="36" fill="#fdf1dc" stroke="#444"/>
    <text x="495" y="382" fill="#444">24</text>
    <text x="595" y="384" text-anchor="middle">weakReferenceOrBaseObject_</text>
    <text x="595" y="398" text-anchor="middle">base object, or weak ref impl (tagged)</text>
    <text x="712" y="384">sizeof = 32 (24 without ObjC).</text>
    <text x="712" y="398">Lives in an ExtraObjectCell, never in the object.</text>
    <text x="60" y="424">type_info() clears the tag and loads ->typeInfo_: it works for both pointees because</text>
    <text x="60" y="438">static_assert(offsetof(ExtraObjectData, typeInfo_) == offsetof(TypeInfo, typeInfo_)) (ExtraObjectData.hpp).</text>
  </g>

  <text x="12" y="452" font-size="11" fill="#111">Sources: Memory.h (ObjHeader, ArrayHeader, ObjectTag), alloc/HeapObject.hpp, KObject.hpp, mm/ExtraObjectData.hpp;</text>
  <text x="12" y="466" font-size="11" fill="#111">compiler side: ClassLayoutBuilder.kt, RTTIGenerator.getInstanceSize, KotlinStaticData.permanentTag, CodeGenerator.immTypeInfoMask.</text>
</svg>
