<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>
  <text x="20" y="24" font-size="15" font-weight="bold" fill="#111">The same graph after CondensationBuilder (SCCs, then equivalent-node merging)</text>

  <!-- left: sources and main variables, unchanged -->
  <rect x="20" y="50" width="200" height="44" rx="6" fill="#fdf1dc" stroke="#444" stroke-width="2.5"/>
  <text x="120" y="68" text-anchor="middle" fill="#111">Source Class$Square</text>
  <text x="120" y="85" text-anchor="middle" font-size="11" fill="#111">{Square}</text>
  <rect x="20" y="130" width="200" height="36" rx="6" fill="#e8eef7" stroke="#444" stroke-width="2.5"/>
  <text x="120" y="153" text-anchor="middle" fill="#111">Variable$main (inst1)</text>
  <rect x="20" y="230" width="200" height="44" rx="6" fill="#fdf1dc" stroke="#444" stroke-width="2.5"/>
  <text x="120" y="248" text-anchor="middle" fill="#111">Source Class$Circle</text>
  <text x="120" y="265" text-anchor="middle" font-size="11" fill="#111">{Circle}</text>
  <rect x="20" y="310" width="200" height="36" rx="6" fill="#e8eef7" stroke="#444" stroke-width="2.5"/>
  <text x="120" y="333" text-anchor="middle" fill="#111">Variable$main (inst2)</text>

  <!-- Throws kept -->
  <rect x="270" y="40" width="250" height="36" rx="6" fill="#e8eef7" stroke="#444"/>
  <text x="395" y="63" text-anchor="middle" fill="#111">Throws$describe (kept: cast edge in)</text>

  <!-- M1: receiver multi-node -->
  <rect x="270" y="110" width="270" height="226" rx="8" fill="#eaf5e6" stroke="#444" stroke-width="2.5"/>
  <text x="282" y="130" font-weight="bold" fill="#111">multi-node (root: Param#0$Shape.&lt;init&gt;)</text>
  <g font-size="12" fill="#111">
    <text x="282" y="152">Param#0$describe  ← the receiver</text>
    <text x="282" y="170">VirtualSlotParam#0$area</text>
    <text x="282" y="188">Param#0$Square.area</text>
    <text x="282" y="206">Param#0$Circle.area</text>
    <text x="282" y="224">Param#0$Shape.&lt;init&gt;</text>
    <text x="282" y="242">(from the constructor bodies, not drawn before)</text>
  </g>
  <line x1="282" y1="256" x2="528" y2="256" stroke="#444"/>
  <text x="282" y="276" font-size="12" fill="#111">why: each has a single non-Source parent,</text>
  <text x="282" y="292" font-size="12" fill="#111">or the same parent set {inst1, inst2}</text>
  <text x="282" y="316" font-size="12" font-weight="bold" fill="#111">types = {Square, Circle}   useful</text>

  <!-- right: return chains -->
  <rect x="590" y="70" width="190" height="44" rx="6" fill="#e8eef7" stroke="#444"/>
  <text x="685" y="88" text-anchor="middle" fill="#111">Returns$Square.area *</text>
  <text x="685" y="105" text-anchor="middle" font-size="11" fill="#111">not useful: types never computed</text>
  <rect x="590" y="170" width="190" height="44" rx="6" fill="#e8eef7" stroke="#444"/>
  <text x="685" y="188" text-anchor="middle" fill="#111">Returns$Circle.area *</text>
  <text x="685" y="205" text-anchor="middle" font-size="11" fill="#111">not useful</text>
  <rect x="590" y="300" width="190" height="44" rx="6" fill="#fdf1dc" stroke="#444"/>
  <text x="685" y="318" text-anchor="middle" fill="#111">Source Const$Int</text>
  <text x="685" y="335" text-anchor="middle" font-size="11" fill="#111">{Int}</text>

  <rect x="810" y="70" width="180" height="144" rx="8" fill="#e8eef7" stroke="#444"/>
  <text x="822" y="90" font-weight="bold" fill="#111">multi-node</text>
  <g font-size="12" fill="#111">
    <text x="822" y="112">VirtualSlotReturns$area</text>
    <text x="822" y="130">VirtualCallReturns$describe</text>
    <text x="822" y="148">Returns$describe</text>
    <text x="822" y="172">root has two parents;</text>
    <text x="822" y="188">the others joined it</text>
    <text x="822" y="206">not useful</text>
  </g>

  <!-- edges -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <line x1="120" y1="94" x2="120" y2="128"/>
    <line x1="120" y1="274" x2="120" y2="308"/>
    <line x1="220" y1="148" x2="268" y2="190"/>
    <line x1="220" y1="328" x2="268" y2="260"/>
    <line x1="685" y1="300" x2="685" y2="216"/>
    <path d="M 780 320 C 800 320 800 95 782 95"/>
    <line x1="780" y1="92" x2="808" y2="110"/>
    <line x1="780" y1="192" x2="808" y2="160"/>
  </g>
  <g stroke="#444" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)">
    <line x1="395" y1="110" x2="395" y2="78"/>
  </g>
  <text x="402" y="100" font-size="11" fill="#111">cast {Virtual}</text>

  <!-- notes -->
  <text x="20" y="380" font-size="12" fill="#111">* Const$Int → TempVar → Returns$Square.area collapses into one node (single non-Source parent), but the Square and Circle</text>
  <text x="20" y="397" font-size="12" fill="#111">  chains are not merged with each other: squashEquivalentNodes skips a node whose only parent is a Source before the signature step.</text>
  <text x="20" y="420" font-size="12" fill="#111">Propagation (greedy sweeps + BFS) touches only useful nodes (thick border): Class$Square → inst1 → multi-node, Class$Circle → inst2 → multi-node.</text>
  <text x="20" y="437" font-size="12" fill="#111">Nodes in the right half are skipped entirely, which is the 20× saving mentioned in the commit history.</text>
  <text x="20" y="458" font-size="11" fill="#111">Verified against -Xverbose-phases=DevirtualizationAnalysis output: "Types of multi-node #6 / Node #&lt;Param#0$Shape.&lt;init&gt;&gt; / Square, Circle".</text>
</svg>
