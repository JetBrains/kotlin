org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.native.home=../dist
kotlin.native.jvmArgs=-Xmx6G
org.gradle.jvmargs=-Xmx3g
nativeWarmup = 10
attempts = 20
nativeJson = nativeReport.json

kotlin.mpp.enableCInteropCommonization=true
# klib cross-compilation is not required and produces warnings on Linux
kotlin.native.enableKlibsCrossCompilation=false
kotlin.native.ignoreDisabledTargets=true

# kotlinx-benchmark uses KSP, which uses AA, which has a default limit for file size;
# files larger than it are ignored. For us it means, that no benchmarks were generated from
# large source files.
# The limit is configured with the following system property with value to -1 disabling the limit.
# See KT-89420 and https://github.com/Kotlin/kotlinx-benchmark/issues/408 for more details
systemProp.idea.max.intellisense.filesize=-1
