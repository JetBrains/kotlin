# Junie Live CLI config for running on GitHub Actions against the Kotlin repo.
# Secrets/values are injected from the workflow env file; do NOT hardcode them.
schema-version: 1
profile: junie-live-ci-kotlin

git:
  allowed-branches: ["junie-live/*"]
  repositories:
    - url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git
      auth: github-app
      github-app:
        app-id: ${GITHUB_APP_ID}
        installation-id: ${GITHUB_APP_INSTALLATION_ID}
        private-key: ${GITHUB_APP_PRIVATE_KEY}

slack:
  bot-token: ${SLACK_BOT_TOKEN_JUNIE_LIVE}
  app-token: ${SLACK_APP_TOKEN_JUNIE_LIVE}
  channels:
    - name: primary
      id: ${SLACK_CHANNEL_ID}

backend:
  project_id: ${JUNIE_LIVE_PROJECT_ID}
  token: ${JUNIE_LIVE_BACKEND_TOKEN}
  state:
    enabled: true
    fail_if_not_restored: true

agent-settings:
  hermes:
    model:
      - id: claude-opus-4-8
        provider: ingrazzio/anthropic
        reasoning_effort: medium
  junie-cli:
    model:
      - id: grok-4.5
        provider: ingrazzio

web-search:
  provider: ingrazzio/tavily
  headers:
    X-Accept-EAP-License: "true"

ingrazzio:
  url: https://ingrazzio-cloud-prod.labs.jb.gg
  api-key: ${JUNIE_API_KEY}

# Sandbox is off in CI (--use-sandbox=false inside the agent container). The
# former sandbox.disable-filesystem / network allow-list block is intentionally
# omitted: current junie-live releases reject unknown sandbox fields, and with
# SRT disabled the whole block is dead. Isolation is Docker (proxy netns +
# separate agent mounts), not bubblewrap.

