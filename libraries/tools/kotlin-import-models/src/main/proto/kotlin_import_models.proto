edition = "2023";

package org.jetbrains.kotlin.importmodels.proto;
option java_multiple_files = true;

import "google/protobuf/any.proto";

message Error {
  enum Type {
    ERROR_TYPE_UNSPECIFIED = 0;
    ERROR_TYPE_UNKNOWN_MODEL_ID = 1;
    ERROR_TYPE_UNKNOWN_MODEL_PARAMS = 2;
    ERROR_TYPE_UNSUPPORTED_MODEL_ID = 3;
    ERROR_TYPE_UNSUPPORTED_MODEL_PARAMS = 4;
    ERROR_TYPE_INTERNAL_ERROR = 5;
    ERROR_TYPE_GENERIC_ERROR = 6;
  }

  Type error_type = 1;
  string error_message = 2;
}

message Result {
  oneof result {
    google.protobuf.Any model = 1;
    Error error = 2;
  }
}

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
  string classifier = 4;
}

message SourceRoot {
  enum Kind {
    SOURCE_ROOT_KIND_UNSPECIFIED = 0;
    SOURCE_ROOT_KIND_SOURCE = 1;
    SOURCE_ROOT_KIND_GENERATED = 2;
  }

  string path = 1;
  Kind kind = 2;
  repeated Action producing_actions = 3;
}

message CompilationUnitId {
  string value = 1;
}

message BaseModel {
  enum Capability {
    CAPABILITY_UNSPECIFIED = 0;
    CAPABILITY_KOTLIN_JVM = 1;
    CAPABILITY_KOTLIN_MULTIPLATFORM = 2;
  }

  string id = 1;
  Version plugin_version = 2;
  repeated Capability capabilities = 3;
}

message ProjectModel {
  string id = 1;
  repeated CompilationUnitId compilation_unit_ids = 3;
}

message Action {
  message GradleTask {
    string task_path = 1;
  }

  oneof build_tool_action {
    GradleTask gradle_action = 1;
  }
}

message CompilationUnitModel {
  enum Platform {
    PLATFORM_UNSPECIFIED = 0;
    PLATFORM_JVM = 1;
    PLATFORM_NATIVE = 2;
    PLATFORM_METADATA = 3;
  }

  enum TargetPlatform {
    TARGET_PLATFORM_UNSPECIFIED = 0;
    TARGET_PLATFORM_JVM = 1;
    TARGET_PLATFORM_NATIVE = 2;
  }

  enum Purpose {
    COMPILATION_PURPOSE_UNSPECIFIED = 0;
    COMPILATION_PURPOSE_MAIN = 1;
    COMPILATION_PURPOSE_TEST = 2;
    COMPILATION_PURPOSE_TEST_FIXTURES = 3;
  }

  message Parameters {
    CompilationUnitId compilation_unit_id = 1;
  }

  message Output {
    enum Kind {
      OUTPUT_KIND_UNSPECIFIED = 0;
      OUTPUT_KIND_CLASSES = 1;
      OUTPUT_KIND_CRI = 2;
      OUTPUT_KIND_KLIB = 3;
    }

    string path = 1;
    repeated Action producing_actions = 2;
    Kind kind = 3;
  }

  string id = 1;
  Parameters parameters = 2;
  string name = 3;
  Platform platform = 4;
  Purpose purpose = 5;
  repeated Output outputs = 6;
  repeated SourceRoot source_roots = 7;
  repeated TargetPlatform target_platforms = 8;
  string target_name = 9;
}

message CompilerArgumentsModel {
  message Parameters {
    CompilationUnitId compilation_unit_id = 1;
  }

  string id = 1;
  Parameters parameters = 2;
  repeated string arguments = 3;
}

message MavenCoordinates {
  string group = 1;
  string module = 2;
  string version = 3;
}

message BinaryDependency {
  MavenCoordinates coordinates = 1;
  string artifact_path = 2;
}

message DependenciesModel {
  enum Scope {
    DEPENDENCY_SCOPE_UNSPECIFIED = 0;
    DEPENDENCY_SCOPE_COMPILE = 1;
    // TODO: Support RUNTIME dependency scope
    DEPENDENCY_SCOPE_RUNTIME = 2;
    DEPENDENCY_SCOPE_COMPILER_PLUGIN = 3;
  }

  enum Coverage {
    DEPENDENCY_COVERAGE_UNSPECIFIED = 0;
    // TODO: Support LOCAL dependency coverage without triggering Gradle resolution
    DEPENDENCY_COVERAGE_LOCAL = 1;
    DEPENDENCY_COVERAGE_ALL = 2;
  }

  message Unresolved {
    MavenCoordinates coordinates = 1;
    string failure_message = 2;
  }

  message ProjectDependency {
    string build_path = 1;
    string project_path = 2;
    CompilationUnitId target_compilation_unit_id = 3;
    string artifact_path = 4;
  }

  message ClasspathEntry {
    oneof dependency {
      BinaryDependency binary = 1;
      ProjectDependency project = 2;
    }
  }

  message CompilationRelation {
    enum Kind {
      COMPILATION_RELATION_KIND_UNSPECIFIED = 0;
      COMPILATION_RELATION_KIND_FRIEND = 1;
    }
    Kind kind = 1;
    CompilationUnitId target_compilation_unit_id = 2;
  }

  message Parameters {
    CompilationUnitId compilation_unit_id = 1;
    Scope scope = 2;
    Coverage coverage = 3;
  }

  string id = 1;
  Parameters parameters = 2;
  repeated ClasspathEntry classpath_entries = 3;
  repeated Unresolved unresolved_dependencies = 4;
  repeated CompilationRelation compilation_relations = 5;
}
