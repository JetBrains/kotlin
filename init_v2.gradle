@CompileStatic
public class SuiteDescriptorWrapper extends DescriptorWrapper {
    private static final Pattern partition = Pattern.compile("^Partition \\d+ .*")

    SuiteDescriptorWrapper(TestDescriptor descriptor, FlowWrapper flow, Pattern ignore) {
        super(descriptor, flow, ignore)
    }

    void start(Closure action) {
        if (ignored) return
        ServiceMessage suiteStartedMessage = new ServiceMessage(name: "testSuiteStarted", attributes: [name: descriptor.name, flowId: flowId])
        action(flow.start(this, parent), suiteStartedMessage)
    }

    void finish(Closure action) {
        if (ignored) return
        ServiceMessage suiteFinishedMessage = new ServiceMessage(name: "testSuiteFinished", attributes: [name: descriptor.name, flowId: flowId])
        action(flow.finish(this), suiteFinishedMessage)
    }

    boolean isIgnored() {
        if (descriptor.parent == null) return true
        if (descriptor.name.startsWith("Gradle Test Executor")) return true
        if (descriptor.name.startsWith("Gradle Test Run")) return true
        if (ignoreSuite != null) {
            return ignoreSuite.matcher(descriptor.name).matches()
        } else {
            return descriptor.name.startsWith("Partition ") && partition.matcher(descriptor.name).matches()
        }
    }
}

@CompileStatic
public class TestDescriptorWrapper extends DescriptorWrapper {
    private final TestNameDescriptor testNameDescriptor
    private final BuildDirectoriesResolver buildDirectoriesResolver
    private static final int MAX_MESSAGE_SIZE = Integer.getInteger(Constants.MESSAGE_MAX_LENGTH_SYSTEM_PROP, 18 * 1024)
    private static final String OUTPUT_PARSER = System.getProperty(Constants.MESSAGE_PARSER_TYPE_SYSTEM_PROP, "ServiceMessage")

    TestDescriptorWrapper(TestDescriptor descriptor, TestNameDescriptor testNameDescriptor, FlowWrapper flow, BuildDirectoriesResolver buildDirectoriesResolver, Pattern ignoreSuite) {
        super(descriptor, flow, ignoreSuite)
        this.testNameDescriptor = testNameDescriptor
        this.buildDirectoriesResolver = buildDirectoriesResolver
    }

    void start(Closure action) {
        ServiceMessage testStartedMessage = new ServiceMessage(name: "testStarted", attributes: [name: testName, flowId: flowId])
        action(flow.start(this, parent), testStartedMessage)
    }

    void finish(TestResult result, Closure action) {
        ServiceMessage testFinishedMessage = new ServiceMessage(name: "testFinished",
                attributes: [name    : testName,
                             duration: String.valueOf((int)(result.endTime - result.startTime)),
                             flowId  : flowId])
        action(flow.finish(this), testFinishedMessage)
    }

    boolean isIgnored() {
        return className == null
    }

    void result(TestResult result, AtomicLong testCounter, Closure action) {
        ResultType resultType = result != null ? result.getResultType() : ResultType.SUCCESS
        switch (resultType) {
            case ResultType.FAILURE:
                WrappedException exception = new WrappedException(result.getException())
                List<ServiceMessage> messages = attacheBigFailTestMessage(exception, testCounter)
                ServiceMessage failure = exception.getServiceMessage(testName).withFlowId(flowId)
                List<ServiceMessage> allMessages = new ArrayList<ServiceMessage>(messages)
                allMessages.add(failure)
                action(allMessages)
                break
            case ResultType.SKIPPED:
                ServiceMessage skipped = new ServiceMessage(name: "testIgnored",
                        attributes: [name   : testName,
                                     message: "",
                                     flowId : flowId])
                action(Collections.singletonList(skipped))
                break
        }
    }

    void flush(List<TestOutputEvent> outputs, Closure action) {
        if (outputs == null || outputs.isEmpty()) return
        StringBuilder stdout = new StringBuilder()
        StringBuilder stderr = new StringBuilder()

        synchronized (outputs) {
            for (TestOutputEvent oe : outputs) {
                switch (oe.destination) {
                    case TestOutputEvent.Destination.StdErr:
                        stderr.append(oe.message)
                        break
                    case TestOutputEvent.Destination.StdOut:
                        stdout.append(oe.message)
                        break
                }
            }

            if (stdout.length() > 0) {
                flushOutputMessage("testStdOut", trimTrailingNewline(stdout.toString()), action)
            }
            if (stderr.length() > 0) {
                flushOutputMessage("testStdErr", trimTrailingNewline(stderr.toString()), action)
            }
        }
    }

    private static String trimTrailingNewline(String text) {
        if (text.endsWith("\r\n")) {
            return text.substring(0, text.length() - 2)
        } else if (text.endsWith("\n") || text.endsWith("\r")) {
            return text.substring(0, text.length() - 1)
        }
        return text
    }

    private void flushOutputMessage(String type, String message, Closure action) {
        int offset = 0
        int length = message.length()
        while (offset < length) {
            String msg
            switch (OUTPUT_PARSER) {
                case "disabled":
                    msg = getMessageWithoutParsing(message, offset, MAX_MESSAGE_SIZE)
                    break
                case "ServiceMessage":
                default:
                    msg = getMessageWithParsing(message, offset, MAX_MESSAGE_SIZE)
                    break
            }
            offset += msg.length()
            action(new ServiceMessage(name: type, attributes: [name     : testName,
                                                               out      : msg,
                                                               "tc:tags": (OUTPUT_PARSER == "disabled" ? null : "tc:parseServiceMessagesInside"),
                                                               flowId   : flowId]))
        }
    }

    private static String getMessageWithoutParsing(String message, int offset, int maxLength) {
        int end = Math.min(offset + maxLength, message.length())
        return message.substring(offset, end)
    }

    private static String getMessageWithParsing(String message, int offset, int maxLength) {
        int remaining = message.length() - offset
        if (remaining <= maxLength) return message.substring(offset)

        int maxEnd = offset + maxLength

        // Find inner service messages and try not to split each message
        int start = message.indexOf(ServiceMessage.START_MESSAGE, offset)
        if (start == -1 || start > maxEnd) return message.substring(offset, maxEnd)

        int end = getEndMessage(message, start)
        if (end == -1) return message.substring(offset, maxEnd)
        if (end > maxEnd) return message.substring(offset, start > offset ? start : maxEnd)

        while (end < maxEnd) {
            int newStart = message.indexOf(ServiceMessage.START_MESSAGE, end)
            if (newStart == -1 || newStart >= maxEnd) return message.substring(offset, maxEnd)

            int newEnd = getEndMessage(message, newStart)
            if (newEnd == -1) return message.substring(offset, maxEnd)

            if (newEnd >= maxEnd) return message.substring(offset, newStart)

            end = newEnd
        }
        return message.substring(offset, end)
    }

    private static int getEndMessage(String msg, int position) {
        char lastChar = 0
        while (position < msg.length()) {
            char currentChar = msg.charAt(position)
            if (lastChar != ServiceMessage.ESCAPE_CHARACTER.charAt(0) && currentChar == ServiceMessage.END_MESSAGE.charAt(0)) return position
            else if (lastChar == ServiceMessage.ESCAPE_CHARACTER.charAt(0) && currentChar == ServiceMessage.ESCAPE_CHARACTER.charAt(0)) lastChar = 0
            else lastChar = currentChar

            position++
        }
        return -1
    }

    private String getTestName() {
        testNameDescriptor != null ? testNameDescriptor.getTestName(this) : TestNameDescriptor.DEFAULT.getTestName(this)
    }

    String getClassName() {
        return descriptor.getClassName()
    }

    String getName() {
        return descriptor.getName()
    }

    String getClassDisplayName() {
        return descriptor.getClassName()
    }

    String getDisplayName() {
        return descriptor.getDisplayName() != null ? descriptor.getDisplayName() : descriptor.getName()
    }

    private List<ServiceMessage> attacheBigFailTestMessage(WrappedException exception, AtomicLong testCounter) {
        if(exception.small) return []

        File artifactDir = createBigStacktracesDir()
        if (artifactDir == null) {
            return []
        }
        String fileName = "${testCounter.incrementAndGet()}.log"
        File artifactPath = new File(artifactDir, fileName)

        PrintStream logFilePrint
        try {
            artifactPath.delete()
            logFilePrint = new PrintStream(new FileOutputStream(artifactPath))
            exception.th.printStackTrace(logFilePrint)
        } finally {
            logFilePrint?.close()
        }

        String artifactName = ".teamcity/gradle/${artifactDir.name}"
        def artifact = new ServiceMessage(name: "publishArtifacts", attributes: ["": "${artifactPath.canonicalPath} => ${artifactName}" as String, flowId: flowId])
        ServiceMessage metadata = new ServiceMessage(name: "testMetadata",
                attributes: [testName: testName,
                             type    : 'artifact',
                             value   : "${artifactName}/${fileName}" as String,
                             name    : 'teamcity.test.output',
                             flowId  : flowId])
        return [artifact, metadata]
    }

    synchronized private File createBigStacktracesDir() {
        final String path = buildDirectoriesResolver.getBuildStacktraceLogDir()
        if (path != null && !path.isEmpty()) return new File(path)

        final String rootTmpDirectory = buildDirectoriesResolver.getBuildTempDir() ?: buildDirectoriesResolver.getBuildDir().path
        File resultDir = new File("${rootTmpDirectory}${File.separator}.teamcity${File.separator}testFailMessages${File.separator}${System.nanoTime()}")
        if (resultDir.mkdirs()) {
            buildDirectoriesResolver.setBuildStacktraceLogDir(resultDir.path)
            return resultDir
        }
        return null
    }

    @Override
    boolean equals(Object obj) {
        return obj != null &&
                obj.class == TestDescriptorWrapper.class &&
                descriptor.equals(((TestDescriptorWrapper)obj).descriptor)
    }

    @Override
    int hashCode() {
        return descriptor.hashCode()
    }
}

