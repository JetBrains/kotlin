# gradle-profiler scenarios for benchmarking the Kotlin build itself.
#
# The modularized test harness (run-bench.sh) measures one process doing CPU and file work. It deliberately forks
# almost nothing, so it cannot see the largest measured effect of the endpoint security agents: ~2.8x on
# fork+exec+wait. A real Gradle build forks constantly - workers, the Kotlin daemon, javac, git - and its
# configuration phase stats tens of thousands of files, so it is the complementary workload.
#
# Install:  brew install gradle-profiler        (or: sdk install gradleprofiler)
#
# Run (from the repository root), once per configuration, changing only --output-dir:
#
#   gradle-profiler --benchmark --measure-gc \
#       --scenario-file compiler/fir/modularized-tests/scripts/gradle-profiler-scenarios.conf \
#       --output-dir tmp/gradle-profiler/m5max-falcon-on
#
# gradle-profiler does the statistics properly: it warms the daemon up, repeats every scenario, and writes
# benchmark.csv / benchmark.html with per-iteration times and the mean/median/stddev, plus a task-level breakdown.
# Compare the two output directories by the medians in benchmark.csv - and treat a difference below the reported
# stddev as noise.
#
# Add `--profile chrome-trace` (or `async-profiler`, if you have it) to a *single* scenario when you want to see
# where the time goes; do not profile and benchmark in the same run.

default-scenarios = ["configuration", "abi_change", "non_abi_change"]

# The configuration phase: script compilation, dependency-cache lookups and tens of thousands of stat/open calls,
# with no compilation at all. This is the purest "file system syscall latency" end-to-end scenario.
configuration {
    title = "configuration phase only"
    tasks = ["help"]
    warm-ups = 3
    iterations = 10
    measure-config-time = true
    gradle-args = ["--offline"]
}

# Incremental compilation after an ABI change: recompiles the module and everything downstream of it, forking the
# Kotlin/Java compilation workers. The exec-heavy scenario.
abi_change {
    title = "incremental build after an ABI change"
    tasks = [":compiler:frontend:classes"]
    apply-abi-change-to = ["compiler/frontend/src/org/jetbrains/kotlin/resolve/BindingContext.java"]
    warm-ups = 3
    iterations = 10
    gradle-args = ["--offline"]
}

# Incremental compilation after a non-ABI change: one module recompiles, the rest is up-to-date checking, i.e.
# mostly hashing the inputs - the read-heavy scenario.
non_abi_change {
    title = "incremental build after a non-ABI change"
    tasks = [":core:compiler.common:classes"]
    apply-non-abi-change-to = ["core/compiler.common/src/org/jetbrains/kotlin/util/UnitStats.kt"]
    warm-ups = 3
    iterations = 10
    gradle-args = ["--offline"]
}

# Cold daemon: every iteration starts a fresh Gradle daemon, so the JVM startup, the class loading of the whole
# build logic and the first population of the file system caches are included. Slow, but it is the scenario a
# developer feels most often. Enable it explicitly: --scenarios cold_daemon
cold_daemon {
    title = "up-to-date build with a cold daemon"
    tasks = [":compiler:frontend:classes"]
    daemon = cold
    warm-ups = 1
    iterations = 5
    gradle-args = ["--offline"]
}

# The heaviest realistic scenario: building the distribution from a clean state. It forks thousands of processes.
# Takes tens of minutes per iteration, so only two iterations and no warm-up. Enable explicitly: --scenarios dist
dist {
    title = "clean :dist"
    tasks = [":dist"]
    cleanup-tasks = ["clean"]
    warm-ups = 0
    iterations = 2
    gradle-args = ["--offline"]
}
