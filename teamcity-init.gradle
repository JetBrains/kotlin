initscript {
    dependencies {
        def scriptDir = initscript.sourceFile != null ? initscript.sourceFile.parentFile : file('.')
        def possibleLocations = [
            new File(scriptDir, "teamcity-init-plugin.jar"),
        ]
        def pluginJar = possibleLocations.find { it.exists() }
        if (pluginJar != null) {
            classpath files(pluginJar)
        } else {
            throw new GradleException("TeamCity init plugin JAR not found in ${possibleLocations.collect { it.absolutePath }}. Either build it with './gradlew -p tc-init-plugin jar' or commit the precompiled JAR to the repository.")
        }
    }
}

apply plugin: org.jetbrains.teamcity.TeamCityInitPlugin
