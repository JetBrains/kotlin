$schema: domains.schema.json

CompilerInfrastructure:
  team: "Kotlin Frontend"
  firstResponders:
    - dmitriy.novozhilov@jetbrains.com
    - kirill.rakhman@jetbrains.com
  include:
  - "core"
  - "build-common"
  - "compiler/arguments"
  - "compiler/arguments.common"
  - "compiler/cli/bin"
  - "compiler/arguments.common"
  - "compiler/cli/cli-arguments-generator"
  - "compiler/cli/cli-base"
  - "compiler/cli/cli-js"
  - "compiler/cli/cli-jvm"
  - "compiler/cli/cli-metadata"
  - "compiler/cli/cli-native-klib"
  - "compiler/cli/cli-runner"
  - "compiler/cli/src"
  - "compiler/cli/resources"
  - "compiler/cli/build.gradle.kts"
  - "compiler/compiler.version"
  - "compiler/config"
  - "compiler/config.jvm"
  - "compiler/container"
  - "compiler/preloader"
  - "compiler/test-infrastructure"
  - "compiler/test-infrastructure-utils"
  - "compiler/test-infrastructure-utils.common"
  - "compiler/testResources"
  - "compiler/testData"
  - "compiler/tests"
  - "compiler/tests-common"
  - "compiler/tests-common-new"
  - "compiler/tests-compiler-utils"
  - "compiler/tests-integration"
  - "compiler/tests-mutes"
  - "compiler/util"
  - "compiler/util-io"
  - "compiler/build.gradle.kts"
  - "jps"
  mustRunAllTestsOnChangesIn:
    - CoreLibs

Frontend:
  team: "Kotlin Frontend"
  firstResponders:
    - kirill.rakhman@jetbrains.com
    - ilya.chernikov@jetbrains.com
    - mikhail.glukhikh@jetbrains.com
  include:
    - "compiler/fir"
    - "compiler/frontend"
    - "compiler/frontend.common"
    - "compiler/frontend.common.jvm"
    - "compiler/frontend.common-psi"
    - "compiler/frontend.java"
    - "compiler/ir/ir.psi2ir"
    - "compiler/java-direct"
    - "compiler/multiplatform-parsing"
    - "compiler/psi/parser"
    - "compiler/resolution"
    - "compiler/resolution.common"
    - "compiler/resolution.common.jvm"
    - "compiler/resolution.common.js"
    - "compiler/serialization"
    - "compiler/serialization.common"
    - "compiler/tests-java8"
    - "compiler/tests-spec"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - CompilerInfrastructure

CommonBackend:
  team: "Kotlin Common Backend"
  firstResponders:
    - dmitriy.dolovov@jetbrains.com
    - ivan.kylchik@jetbrains.com
    - milosz.piekutowski@jetbrains.com
  include:
    - "compiler/ir/ir.actualization"
    - "compiler/ir/ir.inline"
    - "compiler/ir/ir.tree"
    - "compiler/ir/ir.validation"
    - "compiler/ir/serialization.common"
    - "compiler/ir/backend.common"
    - "compiler/util-klib"
    - "compiler/util-klib-abi"
    - "compiler/util-klib-metadata"
    - "compiler/cli/cli-jklib"
    - "compiler/jklib.tests"
    - "compiler/ir/serialization.jklib"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - CompilerInfrastructure
    - Frontend

Jvm:
  team: "Kotlin JVM"
  firstResponders:
    - alexander.udalov@jetbrains.com
    - ilmir.usmanov@jetbrains.com
    - maksim.verevkin@jetbrains.com
  include:
    - "compiler/android-tests"
    - "compiler/backend"
    - "compiler/backend.common.jvm"
    - "compiler/config.jvm"
    - "compiler/ir/backend.jvm"
    - "compiler/ir/serialization.jvm"
    - "compiler/tests-different-jdk"
    - "compiler/tests-java8"
    - "core/metadata.jvm"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - CompilerInfrastructure
    - Frontend
    - CommonBackend

Wasm:
  team: "Kotlin Wasm"
  firstResponders:
    - zalim.bashorov@jetbrains.com
    - jim.teichgraeber@jetbrains.com
  include:
    - "compiler/ir/backend.wasm"
    - "wasm"
    - "js/js.translator/testData"
    - "js/js.sourcemap"
    - "js/typescript-export-model"
    - "js/typescript-printer"
    - "libraries/tools/dukat"
    - "js/js.tests/testFixtures/org/jetbrains/kotlin"
    - "js/js.config/src/org/jetbrains/kotlin/js/config"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - CompilerInfrastructure
    - Frontend
    - CommonBackend

Js:
  team: "Kotlin JS"
  firstResponders:
    - artem.kobzar@jetbrains.com
    - sergej.jaskiewicz@jetbrains.com
  include:
    - "js"
    - "compiler/cli/cli-js"
    - "compiler/ir/backend.js"
    - "compiler/ir/serialization.js"
    - "libraries/tools/analysis-api-based-klib-reader"
    - "libraries/tools/dukat"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - CompilerInfrastructure
    - Frontend
    - CommonBackend

Native:
  team: "Kotlin Native"
  firstResponders:
    - svyatoslav.scherbina@jetbrains.com
    - igor.chevdar@jetbrains.com
    - alexander.shabalin@jetbrains.com
  include:
    - "compiler/ir/backend.native"
    - "compiler/ir/ir.objcinterop"
    - "compiler/ir/serialization.native"
    - "native"
    - "kotlin-native"
  exclude:
    - "native/swift"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - CompilerInfrastructure
    - Frontend
    - CommonBackend

CoreLibs:
  team: "Kotlin Libraries"
  firstResponders:
    - ilya.gorbunov@jetbrains.com
    - filipp.zhinkin@jetbrains.com
  include:
    - "libraries/stdlib"
    - "libraries/tools/kotlin-annotations-jvm"
    - "core/metadata*"
    - "core/reflect*"
    # Old reflect
    - "core/descriptors.runtime"
    - "libraries/kotlinx-metadata"
    - "libraries/reflect"
    - "libraries/kotlin.test"
    - "libraries/tools/jdk-api-validator"

AnalysisApi:
  team: "Kotlin Analysis API"
  firstResponders:
    - dmitry.gridin@jetbrains.com
    - yan.zhulanow@jetbrains.com
  include:
    - "analysis"
    - "compiler/psi"
    - "prepare/analysis-api"
    - "plugins/plugin-sandbox"
    - "plugins/scripting"
  exclude:
    - "compiler/psi/parser"
  mustRunAllTestsOnChangesIn:
    - CompilerInfrastructure
    - Frontend
    - CoreLibs

BuildToolsApi:
  team: "Build Tools API"
  firstResponders:
    - wojciech.kalicinski@jetbrains.com
    - alexander.likhachev@jetbrains.com
    - iveta.kovalenko@jetbrains.com
  include:
    - "build-common"
    - "compiler/build-tools"
    - "compiler/incremental-compilation-*"
    - "compiler/daemon"
    - "compiler/compiler-runner"
    - "compiler/compiler-runner-unshaded"
  mustRunAllTestsOnChangesIn:
    - CompilerInfrastructure

SwiftExport:
  team: "Kotlin Native"
  firstResponders:
    - artem.olkov@jetbrains.com
    - gleb.lukianets@jetbrains.com
  include:
    - "native/swift"
    - "libraries/tools/analysis-api-based-klib-reader"
  mustRunAllTestsOnChangesIn:
    - CoreLibs
    - AnalysisApi # todo: Replace this dependency with a reviewed set of @MustRunOnChangesInAnalysisApi tests

CompilerPlugins:
  team: "Kotlin Frontend"
  firstResponders:
    - dmitriy.novozhilov@jetbrains.com
    - ilya.chernikov@jetbrains.com
    - brian.norman@jetbrains.com
  include:
    - "compiler/plugin-api"
    - "plugins"
    - "libraries/tools/kotlin-main-kts"
    - "libraries/tools/kotlin-main-kts-test"
    - "libraries/scripting"
  mustRunAllTestsOnChangesIn:
    - CompilerInfrastructure
    - Frontend
    - CommonBackend
    - CoreLibs

DocumentationModel:
  team: "Dokka"
  firstResponders:
    - vadim.mishenev@jetbrains.com
    - oleg.yukhnevich@jetbrains.com
  include:
    - "libraries/tools/kotlin-documentation-model"

Gradle:
  team: "Kotlin Build Tools"
  firstResponders:
    - yahor.berdnikau@jetbrains.com
    - anton.lakotka@jetbrains.com
  include:
    - "build-common"
    - "libraries/tools/*gradle*"
    - "compiler/build-tools/kotlin-build-statistics"

Maven:
  team: "Kotlin Build Tools"
  firstResponders:
    - aleksei.cherepanov@jetbrains.com
    - yahor.berdnikau@jetbrains.com
  include:
    - "libraries/tools/*maven*"

# The IntelliJ domain has no owned files in this repository.
# It is used to declare which domains will affect IntelliJ and to infer when to run tests against kt-master
IntelliJ:
  team: "Kotlin Analysis API"
  firstResponders:
    - dmitry.gridin@jetbrains.com
    - yan.zhulanow@jetbrains.com
  include:
    - "prepare/ide-plugin-dependencies"
  mustRunAllTestsOnChangesIn:
    - CompilerInfrastructure
    - Frontend
    - AnalysisApi
    - CoreLibs
    - BuildToolsApi # small set of BTA tests, opportunity for optimizations.
    - CompilerPlugins

BuildInfrastructure:
  team: "Kotlin Build Infrastructure"
  firstResponders:
    - cristian.garcia-marin@jetbrains.com
    - radoslaw.panuszewski@jetbrains.com
    - sebastian.sellmair@jetbrains.com
  include:
    - "repo"
    - "gradle"
    - "build.gradle.kts"
    - "settings.gradle.kts"
    - "gradle.properties"
    - "scripts"
    - ".space"
    - ".idea"

Unknown:
  team: "Kotlin"
  firstResponders:
    - sebastian.sellmair@jetbrains.com
    - dmitriy.novozhilov@jetbrains.com
  # Files not matching other domains will be sorted into 'Unknown' by default.
  include: [ ]
  mustRunAllTestsOnChangesIn:
    - CompilerInfrastructure
