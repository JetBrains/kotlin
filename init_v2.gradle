@CompileStatic
class ServiceMessage {
    static final Set<String> IGNORED_TAGS = new HashSet<String>(Arrays.asList('tc:tags', 'flowId', 'parent'))
    static final String ESCAPE_CHARACTER = '|'
    static final String START_MESSAGE = '##teamcity['
    static final String END_MESSAGE = ']'
    String name
    Map<String, String> attributes

    ServiceMessage() {
    }

    ServiceMessage(String name, Map<String, String> attributes) {
        this.name = name
        this.attributes = attributes
    }

    ServiceMessage withFlowId(String flowId) {
        if (attributes == null) {
            attributes = new LinkedHashMap<String, String>()
        }
        attributes.put('flowId', flowId)
        return this
    }

    String asString() {
        StringBuilder msg = new StringBuilder(START_MESSAGE).append(name)
        if (attributes == null || attributes.isEmpty()) {
        } else if (attributes.containsKey('')) {
            msg = appendAttribute(msg, null, attributes.get(''))
        } else {
            String tags = attributes.get('tc:tags')
            if (tags != null) msg = appendAttribute(msg, 'tc:tags', tags)
            String flowId = attributes.get('flowId')
            String parent = attributes.get('parent')
            for (Map.Entry<String, String> attr : attributes.entrySet()) {
                if (!IGNORED_TAGS.contains(attr.key)) msg = appendAttribute(msg, attr.key, attr.value)
            }
            if (flowId != null) msg = appendAttribute(msg, 'flowId', flowId)
            if (parent != null) msg = appendAttribute(msg, 'parent', parent)
        }
        return msg.append(END_MESSAGE).toString()
    }

    private static StringBuilder appendAttribute(StringBuilder msg, String key, Object value) {
        String strValue = null
        if (value instanceof String) {
            strValue = (String) value
        } else {
            strValue = value != null ? value.toString() : null
        }
        if (key == null) {
            msg.append(' \'')
        } else {
            msg.append(' ').append(key).append('=\'')
        }
        if (strValue != null) {
            for (int i = 0; i < strValue.length(); i++) {
                char ch = strValue.charAt(i)
                switch (ch) {
                    case '\n': msg.append(ESCAPE_CHARACTER).append('n'); break
                    case '\r': msg.append(ESCAPE_CHARACTER).append('r'); break
                    case '|': msg.append(ESCAPE_CHARACTER).append('|'); break
                    case '\'': msg.append(ESCAPE_CHARACTER).append('\''); break
                    case '[': msg.append(ESCAPE_CHARACTER).append('['); break
                    case ']': msg.append(ESCAPE_CHARACTER).append(']'); break
                    default:
                        if (ch < 128) {
                            msg.append(ch)
                        } else {
                            msg.append(ESCAPE_CHARACTER).append('0').append('x')
                            String hex = Integer.toHexString((int)ch)
                            for (int z = hex.length(); z < 4; z++) {
                                msg.append('0')
                            }
                            msg.append(hex)
                        }
                        break
                }
            }
        }
        return msg.append('\'')
    }
}

@CompileStatic
class BuildFeatures {
    static boolean isConfigurationCacheRequested(Gradle gradle) {
        try {
            org.gradle.api.configuration.BuildFeatures bf = ((org.gradle.api.internal.GradleInternal) gradle).getServices().get(org.gradle.api.configuration.BuildFeatures)
            return bf.getConfigurationCache().getRequested().getOrElse(false)
        } catch (Throwable ignored) {
            return false
        }
    }

    static boolean areIsolatedProjectsEnabled(Gradle gradle) {
        try {
            org.gradle.api.configuration.BuildFeatures bf = ((org.gradle.api.internal.GradleInternal) gradle).getServices().get(org.gradle.api.configuration.BuildFeatures)
            return bf.getIsolatedProjects().getActive().getOrElse(false)
        } catch (Throwable ignored) {
            return false
        }
    }
}

@CompileStatic
class Util {
    static String getFlowIdForTask(String taskPath) {
        String flowIfPrefix = "%%teamcity%%-"
        return flowIfPrefix + String.valueOf(taskPath.hashCode())
    }
}

// region Setup of build log presentation for compile tasks stderr

/**
 * Traverses failure exceptions from failed compile tasks and reports them as compilation error messages,
 * creating a "compilation error" build problem in TeamCity without requiring task standard error listeners.
 */
@CompileStatic
abstract class CompileTaskErrorOutputService implements BuildService<BuildServiceParameters.None>, OperationCompletionListener, AutoCloseable {
    private static final Logger logger = Logging.getLogger(CompileTaskErrorOutputService)

    @Override
    void onFinish(FinishEvent finishEvent) {
        if (!(finishEvent instanceof TaskFinishEvent)) return

        TaskFinishEvent taskFinishEvent = (TaskFinishEvent) finishEvent
        if (!(taskFinishEvent.getResult() instanceof TaskFailureResult)) return

        String taskPath = taskFinishEvent.getDescriptor().getTaskPath()
        if (!isCompileTaskPath(taskPath)) return

        TaskFailureResult failureResult = (TaskFailureResult) taskFinishEvent.getResult()
        List<String> messages = extractDiagnosticMessages(failureResult.getFailures())
        if (messages.isEmpty()) {
            messages = Collections.singletonList("Compilation failed for task '" + taskPath + "'. See raw build log for details.")
        }

        String flowId = Util.getFlowIdForTask(taskPath)
        logger.lifecycle(new ServiceMessage(name: "compilationStarted", attributes: [compiler: taskPath]).withFlowId(flowId).asString())
        for (String msg : messages) {
            logger.lifecycle(new ServiceMessage(name: "message", attributes: [text: msg, status: "ERROR"]).withFlowId(flowId).asString())
        }
        logger.lifecycle(new ServiceMessage(name: "compilationFinished", attributes: [compiler: taskPath]).withFlowId(flowId).asString())
    }

    private static boolean isCompileTaskPath(String taskPath) {
        if (taskPath == null) return false
        int lastColon = taskPath.lastIndexOf(":")
        String taskName = lastColon >= 0 ? taskPath.substring(lastColon + 1) : taskPath
        return taskName.startsWith("compile") || taskName.contains("Compile")
    }

    private static List<String> extractDiagnosticMessages(List<? extends Failure> failures) {
        if (failures == null || failures.isEmpty()) return Collections.emptyList()
        List<String> messages = new ArrayList<>()
        Set<String> seen = new HashSet<>()
        collectFailureMessages(failures, messages, seen)
        return messages
    }

    private static void collectFailureMessages(List<? extends Failure> failures, List<String> messages, Set<String> seen) {
        if (failures == null) return
        for (Failure failure : failures) {
            if (failure == null) continue

            String msg = failure.getMessage()
            if (msg != null && !msg.trim().isEmpty()) {
                for (String line : msg.split("\r?\n")) {
                    String trimmed = line.trim()
                    if (!trimmed.isEmpty() && seen.add(trimmed)) {
                        messages.add(line)
                    }
                }
            }

            String desc = failure.getDescription()
            if (desc != null && !desc.trim().isEmpty()) {
                for (String line : desc.split("\r?\n")) {
                    String trimmed = line.trim()
                    if (!trimmed.isEmpty() && isRelevantDiagnosticLine(trimmed) && seen.add(trimmed)) {
                        messages.add(line)
                    }
                }
            }

            collectFailureMessages(failure.getCauses(), messages, seen)
        }
    }

    private static boolean isRelevantDiagnosticLine(String line) {
        if (line.startsWith("at ") || line.startsWith("\tat ")) return false
        if (line.startsWith("Caused by:")) return false
        if (line.startsWith("org.gradle.") || line.startsWith("java.lang.")) return false
        if (line.startsWith("...") || line.startsWith("\t...")) return false
        return true
    }

    @Override
    void close() {
    }
}

/**
 * Registers {@link CompileTaskErrorOutputService} to receive task completion events.
 */
@CompileStatic
abstract class CompileTaskErrorOutputPlugin implements Plugin<Gradle> {
    @Inject
    abstract BuildEventsListenerRegistry getBuildEventsListenerRegistry()

    @Override
    void apply(Gradle gradle) {
        if (gradle.parent != null) return
        Provider<CompileTaskErrorOutputService> compileTaskErrorOutputServiceProvider =
                gradle.getSharedServices().registerIfAbsent("compileTaskErrorOutputService", CompileTaskErrorOutputService) {}
        buildEventsListenerRegistry.onTaskCompletion(compileTaskErrorOutputServiceProvider)
    }
}

