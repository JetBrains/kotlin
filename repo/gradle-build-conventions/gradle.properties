org.gradle.jvmargs=-Duser.country=US -Dfile.encoding=UTF-8
# Disabled for the Gradle 10 Provider API migration: the preview distribution promotes Gradle 9.6
# deprecations (by getting/registering delegates, etc.) to errors, which are out of scope here.
org.gradle.kotlin.dsl.allWarningsAsErrors=false

cacheRedirectorEnabled=true
systemProp.org.gradle.internal.plugins.portal.url.override=https://cache-redirector.jetbrains.com/plugins.gradle.org/m2

kotlin.options.suppressFreeCompilerArgsModificationWarning=true
kotlin.compiler.runViaBuildToolsApi=true
kotlin.compiler.execution.strategy=in-process

# Please keep it in sync with root gradle.properties.
# It's currently needed for proper configuration cache work, the reason will be investigated later
org.gradle.java.installations.fromEnv=\
  JDK_1_8,JDK_18,\
  JDK_9_0,JDK_9,\
  JDK_11_0,JDK_11,\
  JDK_16_0,\
  JDK_17_0
